<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            /* SOLAR BACKGROUND */
            background-image: url("solar.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* Dark/light overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 40, 80, 0.18);
        }

        /* Registration Card */
        .register-container {
            position: relative;
            z-index: 1;

            width: 470px;
            padding: 35px 45px;

            background: rgba(255, 255, 255, 0.92);

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(8px);
        }

        /* Solar Icon */
        .solar-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            border: 3px solid #087df5;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;
        }

        h1 {
            text-align: center;
            color: #123a73;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
            font-size: 16px;
        }

        /* Input */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            height: 50px;

            padding: 0 16px;

            border: 1px solid #d5dce5;
            border-radius: 9px;

            outline: none;

            font-size: 15px;

            background: rgba(255, 255, 255, 0.95);

            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #087df5;

            box-shadow:
                0 0 0 3px rgba(8, 125, 245, 0.12);
        }

        .input-group input::placeholder {
            color: #8a8f98;
        }

        /* Register Button */
        .register-btn {
            width: 100%;
            height: 52px;

            margin-top: 8px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #087df5,
                #0056d6
            );

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(0, 100, 220, 0.3);
        }

        /* Login */
        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;
        }

        .login-link a {
            color: #087df5;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .register-container {
                width: 90%;
                padding: 30px 25px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Solar Icon -->
        <div class="solar-icon">
            ☀️
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to get started
        </p>

        <form id="registrationForm">

            <div class="input-group">
                <input
                    type="text"
                    id="fullname"
                    placeholder="Full Name"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


</body>
</html>
